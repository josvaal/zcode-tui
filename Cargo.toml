[workspace]
resolver = "2"
members = [
    "crates/zcode-client",
    "crates/zcode-launcher",
    "crates/zcode-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zai-org/ZCode"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ratatui = "0.29"
crossterm = "0.28"
syntect = "5"
